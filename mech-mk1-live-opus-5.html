hd.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleBar();} });

/* ---------- telemetry sheet ---------- */
const tel=document.getElementById('tel'), telHd=document.getElementById('telHd');
function toggleTel(){ if(innerWidth>=900) return;
  const o=tel.classList.toggle('open'); telHd.setAttribute('aria-expanded',String(o)); }
telHd.addEventListener('click',toggleTel);
telHd.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleTel();} });

/* ---------- twin sticks ----------
   Each zone spawns its stick wherever the thumb lands, so there is no fixed target to
   hunt for on a small screen. Left: forward = speed, lateral = steer. Right: lateral =
   orbit, vertical = zoom. */
function makeStick(zoneId,svgId,knobId){
  const zone=document.getElementById(zoneId), svg=document.getElementById(svgId), knob=document.getElementById(knobId);
  const st={x:0,y:0};
  let id=null, ox=0, oy=0;
  function centre(){ const r=zone.getBoundingClientRect();
    svg.style.left=(r.width/2)+'px'; svg.style.top=(r.height*0.55)+'px'; }
  function reset(){ st.x=0; st.y=0; id=null;
    knob.setAttribute('cx',59); knob.setAttribute('cy',59); svg.classList.remove('live'); centre(); }
  zone.addEventListener('pointerdown',function(e){
    if(id!==null) return;
    id=e.pointerId; zone.setPointerCapture(id);
    ox=e.clientX; oy=e.clientY;
    const r=zone.getBoundingClientRect();
    svg.style.left=(ox-r.left)+'px'; svg.style.top=(oy-r.top)+'px';
    svg.classList.add('live');
  });
  zone.addEventListener('pointermove',function(e){
    if(e.pointerId!==id) return;
    let dx=e.clientX-ox, dy=e.clientY-oy;
    const len=Math.hypot(dx,dy), max=64;
    if(len>max){ dx*=max/len; dy*=max/len; }
    st.x=Math.max(-1,Math.min(1,dx/max)); st.y=Math.max(-1,Math.min(1,-dy/max));
    knob.setAttribute('cx',59+st.x*37); knob.setAttribute('cy',59-st.y*37);
  });
  zone.addEventListener('pointerup',function(e){ if(e.pointerId===id) reset(); });
  zone.addEventListener('pointercancel',function(e){ if(e.pointerId===id) reset(); });
  requestAnimationFrame(centre);
  addEventListener('resize',centre);
  return st;
}
const stickL=makeStick('zoneL','stickL','knobL');
const stickR=makeStick('zoneR','stickR','knobR');

const keys={};
addEventListener('keydown',function(e){ keys[e.key.toLowerCase()]=true;
  if(['arrowleft','arrowright','arrowup','arrowdown'].indexOf(e.key.toLowerCase())>=0) e.preventDefault(); });
addEventListener('keyup',function(e){ keys[e.key.toLowerCase()]=false; });
function kbAxis(neg,pos){ return (keys[pos]?1:0)-(keys[neg]?1:0); }

/* ---------- camera ---------- */
let span=9.8, spanWant=9.8, lastSpan=-1, lastW=-1, lastH=-1;
function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h);
  const railW=(w>=900)?280:0;
  const vw=Math.max(1,w-railW), vh=Math.max(1,h), a=vw/vh;
  camera.left=-span*a/2; camera.right=span*a/2; camera.top=span/2; camera.bottom=-span/2;
  camera.updateProjectionMatrix();
  renderer.setViewport(0,0,vw,vh); renderer.setScissor(0,0,vw,vh); renderer.setScissorTest(true);
  lastSpan=span; lastW=w; lastH=h;
}
addEventListener('resize',resize);

/* ---------- loop ---------- */
const target=new THREE.Vector3(0,3.1,0);
let last=performance.now(), accum=0, fpsT=0, fpsN=0, fps=0;
const DT=1/60;

function tick(now){
  requestAnimationFrame(tick);
  const real=Math.min(0.1,(now-last)/1000); last=now;
  fpsN++; fpsT+=real; if(fpsT>0.5){ fps=fpsN/fpsT; fpsN=0; fpsT=0; }

  const moveY=Math.abs(stickL.y)>0.12?stickL.y:kbAxis('s','w');
  const moveX=Math.abs(stickL.x)>0.12?stickL.x:kbAxis('a','d');
  gait.want.stride=Math.max(0,Math.min(MAX_STRIDE,moveY*MAX_STRIDE));
  gait.want.heading-=moveX*MAX_TURN*real;

  const camX=Math.abs(stickR.x)>0.12?stickR.x:kbAxis('arrowleft','arrowright');
  const camY=Math.abs(stickR.y)>0.12?stickR.y:kbAxis('arrowdown','arrowup');
  azCont-=camX*1.9*real;
  detent=((Math.round(azCont/STEP)%DET)+DET)%DET;
  azimuth=detent*STEP;
  spanWant=Math.max(6.8,Math.min(24,spanWant-camY*10*real));
  span+=(spanWant-span)*Math.min(1,real*6);

  const slow=(now<slowUntil)?0.25:1;
  accum+=real*slow;
  const t0=performance.now(); let n=0;
  while(accum>=DT && n<3){
    const before=world.breakEvents.length;
    gait.update(groundTruthState(rig,world),DT);
    world.step(DT);
    if(world.breakEvents.length>before) slowUntil=now+1500;
    accum-=DT; n++;
  }
  if(n) simMs=simMs*0.9+((performance.now()-t0)/n)*0.1;
  stepCount=gait.stepsTaken||0;

  let lo=Infinity, hi=-Infinity, peak=0, peakName='';
  for(const name of Object.keys(rig.bodies)){
    const b=rig.bodies[name], m=meshes[name];
    m.position.set(b.x.x,b.x.y,b.x.z);
    m.quaternion.set(b.q.x,b.q.y,b.q.z,b.q.w);
    const half=Math.max(b.half.x,b.half.y,b.half.z);
    if(b.x.y-half<lo) lo=b.x.y-half;
    if(b.x.y+half>hi) hi=b.x.y+half;
  }
  for(const n2 of jointNames){
    const j=rig.joints[n2], r=rowEls[n2];
    const u=j.broken?1:Math.min(1,j.util);
    meshes[n2].material.color.setHex(j.broken?0x6E2222:ramp(u));
    const t=j.tauMax?Math.max(-1,Math.min(1,j.tau/j.tauMax)):0;
    const w2=Math.abs(t)*50;
    r.fill.style.width=w2+'%'; r.fill.style.left=(t>=0?50:50-w2)+'%';
    r.fill.style.background='#'+ramp(u).toString(16).padStart(6,'0');
    r.util.textContent=j.broken?'TORN':(u*100).toFixed(0)+'%';
    r.util.style.color=(j.broken||u>0.85)?'#A83232':'#4A463C';
    r.root.classList.toggle('torn',!!j.broken);
    if(u>peak){ peak=u; peakName=n2; }
  }

  document.getElementById('peak').textContent='peak '+(peak*100).toFixed(0)+'% '+peakName;
  document.getElementById('c-rate').textContent=fps.toFixed(0)+' fps · '+simMs.toFixed(1)+' ms';
  document.getElementById('c-speed').textContent=
    Math.hypot(rig.bodies.pelvis.v.x,rig.bodies.pelvis.v.z).toFixed(2)+' m/s';
  document.getElementById('c-steps').textContent=stepCount+' steps';
  const torn=world.breakEvents.length, tc=document.getElementById('c-torn');
  if(torn){ tc.style.display=''; tc.className='chip warn'; tc.textContent=torn+' torn'; }

  /* frame the whole rig on its actual vertical extent, not on the pelvis */
  const p=rig.bodies.pelvis.x, mid=(lo+hi)/2;
  target.x+=(p.x-target.x)*Math.min(1,real*2.2);
  target.z+=(p.z-target.z)*Math.min(1,real*2.2);
  /* bias the framing upward so the rig sits above the stick zone rather than behind it */
  const aim=mid-span*0.12;
  target.y+=(aim-target.y)*Math.min(1,real*1.6);

  azShown+=(azimuth-azShown)*Math.min(1,real*10);
  const rad=60;
  camera.position.set(target.x+rad*Math.cos(ISO)*Math.sin(azShown),
                      target.y+rad*Math.sin(ISO),
                      target.z+rad*Math.cos(ISO)*Math.cos(azShown));
  camera.lookAt(target);

  if(Math.abs(span-lastSpan)>0.01||innerWidth!==lastW||innerHeight!==lastH) resize();
  renderer.render(scene,camera);
}

showNote(); buildWorld('verified');
optList.querySelector('button').setAttribute('aria-pressed','true');
resize(); requestAnimationFrame(tick);
</script>
</body>
